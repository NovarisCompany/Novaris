<script>
// Parámetros físicos iniciales
const v0 = 65; // Velocidad inicial
const anguloGrados = 40; // Ángulo en grados
const anguloRadianes = anguloGrados * (Math.PI / 180); // Conversión correcta a radianes
const g = 10; // Gravedad

// Cálculos físicos
const vox = v0 * Math.cos(anguloRadianes);
const voy = v0 * Math.sin(anguloRadianes);
const tSubida = voy / g;
const tTotal = 2 * tSubida;

const satelite = document.getElementById('satelite');
let idAnimacion = null;
const alturaSuelo = 20;
const entradaDesdeAbajo = 140;

function actualizarPosicion(startTime) {
  let tiempoInicio = startTime || performance.now();

  function loop(tiempoActual) {
    // tiempo transcurrido en segundos (sin parar): usado para el loop
    const raw = (tiempoActual - tiempoInicio) / 1000 * 1.5;

    // si tTotal es cero (evitar div/0), mostramos raw
    const t = tTotal > 0 ? raw % tTotal : raw;

    const x = vox * t;
    const y = (voy * t) - (0.5 * g * t * t);

    // Actualizar valores si existen los elementos
    const setIf = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.innerText = val;
    };
    setIf('val-t', t.toFixed(2));
    setIf('val-x', Math.round(x));
    setIf('val-y', Math.round(y));

    if (satelite) {
      const bottomPx = alturaSuelo + (y * 1.8) - entradaDesdeAbajo;
      const dentroPantalla = bottomPx >= -80 && bottomPx <= window.innerHeight + 80;

      satelite.style.left = (280 + x * 1.8) + 'px';
      satelite.style.bottom = bottomPx + 'px';
      satelite.style.opacity = dentroPantalla ? '1' : '0';
    }

    idAnimacion = requestAnimationFrame(loop);
  }

  idAnimacion = requestAnimationFrame(loop);
}

// Arrancar automáticamente al cargar la páginas
document.addEventListener('DOMContentLoaded', () => {
  actualizarPosicion(performance.now());

  const textoCarga = document.getElementById('texto-carga');
  const mensajes = [
    'Cargando Sistemas de Gestión.',
    'Cargando Sistemas de Gestión..',
    'Cargando Sistemas de Gestión...'
  ];
  let indice = 0;

  function cambiarTextoCarga() {
    if (!textoCarga) return;

    textoCarga.classList.add('cambiando');

    setTimeout(() => {
      textoCarga.textContent = mensajes[indice];
      textoCarga.classList.remove('cambiando');
      indice = (indice + 1) % mensajes.length;
    }, 150);
  }

  cambiarTextoCarga();
  setInterval(cambiarTextoCarga, 1800);
});
</script>
